            // We inject the CSS strictly via JS so we can destroy it without a trace.
            // Matches the dashboard's default "Midnight" preset (--bg:#0f172a,
            // --surf-rgb:30,41,59, --acc-rgb:59,130,246) and .glass-card's
            // translucent/blurred treatment (css/dashboard.css) so the unlock
            // screen isn't jarring against the redesigned dashboard behind it.
            // Hardcoded (no CSS variables available in this standalone template).
            var styleString = "body { background: radial-gradient(circle at 15% 20%, rgba(59,130,246,.16), transparent 40%), radial-gradient(circle at 85% 75%, rgba(59,130,246,.10), transparent 45%), #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; } .box { background: rgba(30,41,59,.55); border: 1px solid rgba(59,130,246,.15); -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%); padding: 30px; border-radius: 12px; text-align: center; color: white; width: 100%; max-width: 350px; box-sizing: border-box; } input { padding: 14px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; font-size: 18px; text-align: center; width: 100%; box-sizing: border-box; outline: none; transition: border-color .15s; } input:focus { border-color: #3b82f6; } button { background: #3b82f6; color: white; border: none; padding: 14px 20px; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; box-sizing: border-box; transition: background .15s, transform .15s, box-shadow .15s; } button:hover { background: #2f6fe0; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }";

            function applyAuthStyles() {
                var styleDiv = document.getElementById('auth-styles');
                if (styleDiv && styleDiv.innerHTML === '') {
                    styleDiv.innerHTML = '<style id="auth-css">' + styleString + '</style>';
                }
            }

            function removeAuthStyles() {
                var cssNode = document.getElementById('auth-css');
                if (cssNode) cssNode.remove();
                document.body.removeAttribute('style');
                document.documentElement.removeAttribute('style');
            }

            function hexToBytes(hex) {
                var a = new Uint8Array(hex.length >> 1);
                for (var i = 0; i < hex.length; i += 2) a[i >> 1] = parseInt(hex.slice(i, i + 2), 16);
                return a;
            }

            function b64ToBytes(b64) {
                var bin = atob(b64), a = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
                return a;
            }

            /**
             * @param {string} pwd - passphrase entered by user or recalled from localStorage
             * @returns {Promise<void>}
             */
            async function performUnlock(pwd) {
                try {
                    var first = encrypted.indexOf(':');
                    var second = encrypted.indexOf(':', first + 1);
                    var salt = hexToBytes(encrypted.slice(0, first));
                    var iv   = hexToBytes(encrypted.slice(first + 1, second));
                    var ct   = b64ToBytes(encrypted.slice(second + 1));
                    var keyMat = await crypto.subtle.importKey(
                        'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
                    );
                    var key = await crypto.subtle.deriveKey(
                        { name: 'PBKDF2', salt: salt, iterations: 600000, hash: 'SHA-256' },
                        keyMat,
                        { name: 'AES-CBC', length: 256 },
                        false, ['decrypt']
                    );
                    var dec = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, ct);
                    var decoded = new TextDecoder().decode(dec);

                    // FR-004: remember for 10 days
                    localStorage.setItem('adnity_passphrase', pwd);
                    localStorage.setItem('adnity_expiry', String(Date.now() + 10 * 24 * 60 * 60 * 1000));

                    // Offer the browser's own native "Save password?" prompt too,
                    // on every successful unlock (manual or silent auto-unlock —
                    // both paths call performUnlock()). Awaited, not fire-and-forget:
                    // document.write() below tears down this document/JS realm, and
                    // an unawaited store() promise risks being abandoned mid-flight
                    // before the browser gets a chance to show/process the prompt.
                    // Raced against a timeout so a stalled OS/keychain call can't
                    // block the unlock indefinitely after the passphrase already
                    // decrypted successfully.
                    if (window.PasswordCredential && navigator.credentials) {
                        try {
                            await Promise.race([
                                navigator.credentials.store(new PasswordCredential({ id: 'adnity-dashboard', password: pwd })),
                                new Promise(function(resolve) { setTimeout(resolve, 3000); })
                            ]);
                        } catch(e) {}
                    }

                    removeAuthStyles();
                    document.open();
                    var currentUrl = window.location.href.split('?')[0].split('#')[0];
                    var baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
                    var finalHtml = decoded;
                    if (finalHtml.includes('<head>')) {
                        finalHtml = finalHtml.replace('<head>', '<head><base href="' + baseUrl + '">');
                    } else {
                        finalHtml = '<base href="' + baseUrl + '">' + finalHtml;
                    }
                    document.write(finalHtml);
                    document.close();
                } catch(e) {
                    localStorage.removeItem('adnity_passphrase');
                    localStorage.removeItem('adnity_expiry');
                    applyAuthStyles();
                    var box = document.getElementById('box');
                    var error = document.getElementById('error');
                    var pwdField = document.getElementById('pwd');
                    if(box) box.style.display = 'block';
                    if(error) error.style.display = 'block';
                    if(pwdField) { pwdField.value = ''; pwdField.focus(); }
                }
            }

            /**
             * @returns {Promise<void>}
             */
            async function init() {
                var stored = localStorage.getItem('adnity_passphrase');
                var expiry = parseInt(localStorage.getItem('adnity_expiry') || '0', 10);
                if (stored && Date.now() < expiry) {
                    var box = document.getElementById('box');
                    if(box) box.style.display = 'none';
                    await performUnlock(stored);
                    return;
                }

                localStorage.removeItem('adnity_passphrase');
                localStorage.removeItem('adnity_expiry');

                // Fallback: no valid localStorage memory (expired, cleared, or a
                // fresh browser profile) — try a browser-saved credential before
                // showing the manual box, mirroring the localStorage check above.
                if (navigator.credentials && window.PasswordCredential) {
                    try {
                        var cred = await navigator.credentials.get({ password: true, mediation: 'silent' });
                        if (cred && cred.password) {
                            await performUnlock(cred.password);
                            return;
                        }
                    } catch(e) {}
                }

                applyAuthStyles();
                var box = document.getElementById('box');
                if(box) box.style.display = 'block';
            }

            var form = document.getElementById('unlock-form');
            var pwdField = document.getElementById('pwd');
            if(form && pwdField) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    performUnlock(pwdField.value);
                });
            }

            init();
        })();
